name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      USE_POSTGRES_FOR_TESTS: "1"
      DATABASE_URL: postgres://budget:budget@localhost:5432/budget
      DJANGO_SECRET_KEY: ci-dummy-secret-not-for-production
      DEBUG: "true"
      SENTRY_DSN: ""
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST_PASSWORD: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PREMIUM_PRICE_ID: ""
      PLAID_CLIENT_ID: ""
      PLAID_SECRET: ""
      PLAID_SANDBOX_SECRET: ""
      PLAID_ENV: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check uncommitted migrations
        run: python manage.py makemigrations --check --settings=config.settings_test
      - name: Django system check
        run: python manage.py check --settings=config.settings_test
      - name: Canonical ledger regression
        run: pytest -m ledger_regression
      - name: Billing, Plaid, matching, and reconciliation
        run: >
          pytest billing plaid_link common/tests
          transactions/tests/test_import_matching.py
          transactions/tests/test_plaid_manual_merge.py
          transactions/tests/test_reconciliation.py
          transactions/tests/test_services.py
          timeline/tests/test_ledger_forecast_matches_transactions_bal.py
          goals
          insights/tests/test_dashboard_summary.py::test_dashboard_projection_only_does_not_materialize_rule_transactions


  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install npm workspaces
        run: npm ci
      - name: Shared package tests
        run: npm test -w @budget-app/shared
      - name: Web tests
        run: npm test -w @budget-app/web

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install npm workspaces
        run: npm ci
      - name: Production Vite build
        run: npm run build:web
