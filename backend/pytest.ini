[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
addopts = -v --tb=short
norecursedirs = .git .venv venv node_modules staticfiles frontend_dist htmlcov
markers =
    ledger_regression: Canonical financial-engine regression. Failures block release. Run: pytest -m ledger_regression
